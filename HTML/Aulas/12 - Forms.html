<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Forms</title>
    </head>

    <body>
        <form action="" method="get" enctype="multipart/form-data">
            <h2>Informe seu endereço</h2>
            <label>Rua:
                <input
                    type="text"
                    autocomplete="address-line1"
                    name="rua"
                >
            </label>
            
            <label>Número:
                <input
                    type="text"
                    autocomplete="address-line2"
                    name="numero"
                >
            </label>

            <br>
            <br>

            <label>Foto do comprovante de residência:
                <input
                    type="file"
                    accept="image/*"
                    name="foto"
                >
            </label>
            
            <br>
            <br>

            <button type="submit">Enviar dados</button>
            <button type="reset">Apagar dados</button>
        </form>
    </body>
</html>
