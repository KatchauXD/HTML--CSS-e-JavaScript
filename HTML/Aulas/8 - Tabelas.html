<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabelas</title>
    </head>

    <body>
        <table border="1" cellpadding="5" bordercolor="blue"> <!-- A tag table define uma tabela, border adiciona uma borda, cellpadding adiciona espaçamento interno, bordercolor define a cor da borda -->
            <tr> <!-- A tag tr define uma linha da tabela -->
                <th>Tipo</th> <!-- A tag th define uma célula de cabeçalho -->
                <th>Valor</th>
                <th>Data</th>
            </tr>
            <tr>
                <td>Alimentação</td>
                <td>R$ 30,00</td>
                <td>10/03/2022</td>
            </tr>
            <tr>
                <td>Diversão</td>
                <td>R$ 48,00</td>
                <td>11/03/2022</td>
            </tr>
            <tr>
                <td>Transporte</td>
                <td>R$ 13,00</td>
                <td>12/03/2022</td>
            </tr>
        </table>
    </body>
</html>
