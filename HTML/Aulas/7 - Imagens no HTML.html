<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imagens no HTML</title>
    </head>

    <body>
        <img 
            src="https://minhasaude.proteste.org.br/wp-content/webp-express/webp-images/uploads/2022/10/abacates.jpg.web"
            alt="foto-de-abacate"
        >
        <img
            src="https://minhasaude.proteste.org.br/wp-content/webp-express/webp-images/uploads/2022/10/abacates.jpg.webp"
            alt="foto-de-abacate"
        >
        <figure>
            <img
                src="https://minhasaude.proteste.org.br/wp-content/webp-express/webp-images/uploads/2022/10/abacates.jpg.webp"
                alt="foto-de-abacate"
                height="200px"
                width="300px"
            >
            <figcaption>Foto de Abacate</figcaption>
        </figure>
    </body>
</html>
