<!DOCTYPE html> <!-- Tipo do arrquivo. Define a versão do HTML (HTML5) -->

<html lang="pt-br"> <!-- Define que é um arquivo HTML (parâmetro informa o idioma) e é onde fica o site inteiro -->
    <head>  <!-- Parte não visível do site, connfigurações do site -->
        <meta charset="UTF-8"> <!-- Informa o conjunto de caracteres utilizado -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Define o viewport para responsividade -->
    </head>

    <body> <!-- Parte visível do site -->
        
    </body>
</html>

<!--
    SEO (Search Engine Optimization) é o processo de otimização de um site para melhorar sua visibilidade e classificação nos motores de busca. Isso envolve a utilização de palavras-chave relevantes, criação de conteúdo de qualidade, otimização de meta tags, construção de backlinks e melhoria da experiência do usuário. O objetivo do SEO é aumentar o tráfego orgânico para o site, tornando-o mais acessível e atraente para os usuários e motores de busca.
-->
