<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>iFrame</title>
    </head>

    <body>
        <!--
        A TAG <iframe> que permite incorporar conteúdo de outra página, como vídeos, mapas, etc.

        Atributos mais comuns:

        -src: para indicar o caminho da página que deve ser incorporada
        -width: para indicar a largura do iFrame
        -height: para indicar a altura do iFrame
        -title: para indicar o título do iFrame, que é importante para acessibilidade
        -frameborder: para indicar se o iFrame deve ter borda ou não
        -->
        <iframe
            width="560"
            height="560"
            src="9 - Vídeo.html"
            title="Teste de iFrame"
            frameborder="1">
        </iframe>
        <iframe
            width="560"
            height="315"
            src="https://www.youtube.com/embed/0XKh2oT0b5w?si=9Y1pnDjWK2kDRz6z"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7350.229521363871!2d-43.59833226712126!3d-22.90913760609283!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9be46312532207%3A0x8afd9a4922454458!2zSW5ob2HDrWJh!5e0!3m2!1spt-BR!2sbr!4v1775749452956!5m2!1spt-BR!2sbr"
            width="600"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </body>
</html>
